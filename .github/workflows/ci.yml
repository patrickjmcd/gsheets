name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: patrickjmcd/workflows/.github/workflows/go-ci.yml@v1

  release:
    if: github.event_name == 'push'
    needs: test
    uses: patrickjmcd/workflows/.github/workflows/release-please.yml@v1
    with:
      release-type: go
    secrets:
      token: ${{ secrets.PAT }}
